  { id: 'daynight', rate: .12, zod: 0, orb: 0, mz: 0, pl: 0 },
  { id: 'manazil', rate: 1.1, zod: 0, orb: 0, mz: 1, pl: 0 },
  { id: 'orbits', rate: 26, zod: .6, orb: 1, mz: 0, pl: 1 },
  { id: 'reflect', rate: 5, zod: .8, orb: .7, mz: 0, pl: 0 }
];
let cur = 0, playing = !REDUCE, sceneT = 0, simDays = 0, rate = SCENES[0].rate;
const mix = { zod: 1, orb: 1, mz: 0, pl: .6 };
const capEl = document.getElementById('cap'), capAr = document.getElementById('capAr'), capTr = document.getElementById('capTr'), capRef = document.getElementById('capRef');
const dotsEl = document.getElementById('dots'), insetEl = document.getElementById('inset');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.className = 'dot'; b.setAttribute('aria-label', L.titles[i]); b.addEventListener('click', () => go(i, true)); dotsEl.appendChild(b); });
function showCaption(i) {
  capEl.classList.add('fade');
  setTimeout(() => {
    capAr.innerHTML = AR[i]; capTr.textContent = L.tr[i]; capTr.style.display = L.tr[i] ? '' : 'none'; capRef.textContent = L.refs[i];
    document.getElementById('stitle').textContent = L.titles[i];
    capEl.classList.remove('fade');
  }, 380);
}
function go(i, manual) {
  cur = (i + SCENES.length) % SCENES.length; sceneT = 0;
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === cur));
  insetEl.classList.toggle('hide', SCENES[cur].id !== 'manazil');
  showCaption(cur);
  if (manual) user.idle = 0;
  try { parent.postMessage({ type: 'cosmos:scene', detail: { index: cur, id: SCENES[cur].id } }, location.origin); } catch (e) { }
}
const playIco = document.getElementById('playIco');
function setPlaying(p) { playing = p; playIco.innerHTML = p ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }
document.getElementById('bPrev').addEventListener('click', () => go(cur - 1, true));
document.getElementById('bNext').addEventListener('click', () => go(cur + 1, true));
document.getElementById('bPlay').addEventListener('click', () => setPlaying(!playing));
document.getElementById('bFull').addEventListener('click', () => { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(() => { }); });
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + (document.dir === 'rtl' ? -1 : 1), true); if (e.key === 'ArrowLeft') go(cur + (document.dir === 'rtl' ? 1 : -1), true); if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); } });

/* ---------- camera: scene targets + user orbit ---------- */
const camPos = new THREE.Vector3(0, 120, 190), camLook = new THREE.Vector3();
const tPos = new THREE.Vector3(), tLook = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
const user = { yaw: 0, pitch: 0, zoom: 1, idle: 99, drag: null };
function sceneTarget(i, t) {
  const eP = E.holder.position;
  if (i === 0) { const az = 0.9 + t * .03; tLook.set(0, 0, 0); tPos.set(Math.cos(az) * 150, 92, Math.sin(az) * 150); }
  else if (i === 1) { tLook.copy(eP); const sd = tmp.copy(eP).normalize(); const perp = tmp2.set(-sd.z, 0, sd.x); tPos.copy(eP).addScaledVector(perp, 6.2).addScaledVector(sd, -1.2); tPos.y += 1.6; }
  else if (i === 2) { tLook.copy(eP); tPos.copy(eP); tPos.y += 13.5; const sd = tmp.copy(eP).normalize(); tPos.addScaledVector(sd, 4.2); }
  else if (i === 3) { const az = 2.2 + t * .02; tLook.set(0, 0, 0); tPos.set(Math.cos(az) * 96, 112, Math.sin(az) * 96); }
  else { const az = 4 + t * .045; tLook.set(0, 0, 0); tPos.set(Math.cos(az) * 190, 46, Math.sin(az) * 190); }
}
const cv = renderer.domElement, ptr = new Map();
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); user.idle = 0; if (ptr.size === 2) { const [a, b] = [...ptr.values()]; user.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: user.zoom }; } });
cv.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return; const p = ptr.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; user.idle = 0;
  if (ptr.size === 2 && user.pinch) { const [a, b] = [...ptr.values()]; user.zoom = Math.min(2.6, Math.max(.35, user.pinch.z * user.pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)))); return; }
  user.yaw -= dx * .005; user.pitch = Math.max(-.9, Math.min(.9, user.pitch + dy * .004));
});
const endP = e => { ptr.delete(e.pointerId); if (ptr.size < 2) user.pinch = null; };
cv.addEventListener('pointerup', endP); cv.addEventListener('pointercancel', endP);
cv.addEventListener('wheel', e => { e.preventDefault(); user.idle = 0; user.zoom = Math.min(2.6, Math.max(.35, user.zoom * (1 + Math.sign(e.deltaY) * .08))); }, { passive: false });

/* ---------- moon-phase inset ---------- */
const phCv = document.getElementById('phase'), phG = phCv.getContext('2d');
const moonTexImg = (() => { const c = document.createElement('canvas'); c.width = c.height = 168; const g = c.getContext('2d'); const n = fbm(21, 5), m = fbm(23, 3); const img = g.createImageData(168, 168);
  for (let y = 0; y < 168; y++) for (let x = 0; x < 168; x++) { const dx = (x - 84) / 80, dy = (y - 84) / 80, rr = dx * dx + dy * dy, i = (y * 168 + x) * 4; if (rr > 1) { img.data[i + 3] = 0; continue; } const u = x / 168, v = y / 168, k = .78 + .4 * n(u, v), mar = sstep(.55, .62, m(u, v)); const c0 = mixC([196, 196, 190], [96, 96, 100], mar * .7).map(q => q * k * (1 - rr * .25)); img.data[i] = c0[0]; img.data[i + 1] = c0[1]; img.data[i + 2] = c0[2]; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c; })();
function drawPhase(elong) { // elong: 0 new → 180 full → 360
  const g = phG, R = 80, cx = 84, cy = 84; g.clearRect(0, 0, 168, 168);
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip(); g.drawImage(moonTexImg, 0, 0);
  // dark part
  const e = norm360(elong) * D2R, k = Math.cos(e); // terminator ellipse x-scale
  const waxing = norm360(elong) < 180;
  g.fillStyle = 'rgba(4,7,10,.9)'; g.beginPath();
  if (waxing) { g.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, true); g.ellipse(cx, cy, Math.max(.01, Math.abs(k) * R), R, 0, Math.PI / 2, -Math.PI / 2, k > 0); }
  else { g.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, false); g.ellipse(cx, cy, Math.max(.01, Math.abs(k) * R), R, 0, Math.PI / 2, -Math.PI / 2, k < 0); }
  g.fill(); g.restore();
  g.strokeStyle = 'rgba(207,224,255,.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.stroke();
}
const phName = document.getElementById('phName'), mzAr = document.getElementById('mzAr'), mzNo = document.getElementById('mzNo');
let lastMz = -1, lastPh = -1, phTick = 0;

/* ---------- visibility / host messages ---------- */
let hostVisible = true;
addEventListener('message', e => {
  if (e.origin !== location.origin) return; const m = e.data || {};
  if (m.type === 'cosmos:visible') hostVisible = !!m.visible;
  if (m.type === 'cosmos:play') setPlaying(true);
  if (m.type === 'cosmos:pause') setPlaying(false);
  if (m.type === 'cosmos:go') go(+m.index || 0, true);
});

/* ---------- resize ---------- */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 60 : 45; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---------- frame ---------- */
const scr = new THREE.Vector3();
function place(lab, v3, alpha, dx, dy) {
  if (alpha < .02) { if (lab.vis) { lab.el.style.opacity = 0; lab.vis = 0; } return; }
  scr.copy(v3).project(camera);
  if (scr.z > 1 || scr.z < -1) { lab.el.style.opacity = 0; lab.vis = 0; return; }
  const x = (scr.x + 1) / 2 * innerWidth + (dx || 0), y = (1 - scr.y) / 2 * innerHeight + (dy || 0);
  lab.el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`; lab.el.style.opacity = alpha.toFixed(2); lab.vis = 1;
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!hostVisible || document.hidden) return;
  const S = SCENES[cur];
  sceneT += dt;
  if (playing && sceneT > (S.id === 'reflect' ? 18 : 16)) go(cur + 1, false);
  const k = 1 - Math.exp(-dt * 1.4);
  rate += ((REDUCE ? S.rate * .4 : S.rate) - rate) * k;
  simDays += dt * rate;
  for (const key of ['zod', 'orb', 'mz', 'pl']) mix[key] += (S[key] - mix[key]) * k;

  // bodies
  for (const p of Object.values(P)) { const lon = p.l0 + 360 * simDays / p.P; lonVec(lon, p.a, p.holder.position); p.mesh.rotation.y += dt * (p.id === 'jupiter' || p.id === 'saturn' ? 1.6 : .5); }
  E.mesh.rotation.y = simDays * TAU; E.clouds.rotation.y = simDays * TAU * .03;
  const mLon = MOON_L0 + 360 * simDays / MOON_P; lonVec(mLon, MOON_A, moon.position); moon.rotation.y = mLon * D2R;
  sun.rotation.y += dt * .04; rays.material.rotation += dt * .01; sunTex.offset.x += dt * .002;
  orbitMat.opacity = .22 * mix.orb; moonOrbit.material.opacity = .28 * Math.max(mix.mz, S.id === 'daynight' ? 0 : .3);
  zMat.opacity = .45 * mix.zod; zBand.forEach(m => m.material.opacity = .16 * mix.zod);
  mzLineMat.opacity = .45 * mix.mz; mzStars.forEach(s => s.material.opacity = mix.mz); mzGroup.visible = mix.mz > .02; zGroup.visible = mix.zod > .02; orbits.visible = mix.orb > .02;

  // camera
  sceneTarget(cur, sceneT);
  user.idle += dt; if (user.idle > 5) { user.yaw *= (1 - k * .5); user.pitch *= (1 - k * .5); user.zoom += (1 - user.zoom) * k * .5; }
  const off = tmp.copy(tPos).sub(tLook); const rr = off.length() * user.zoom * (camera.aspect < 1 ? (cur === 1 || cur === 2 ? 1.9 : 1.35) : 1);
  let az = Math.atan2(off.z, off.x) + user.yaw, el = Math.asin(Math.max(-.999, Math.min(.999, off.y / off.length()))) + user.pitch; el = Math.max(-1.35, Math.min(1.45, el));
  tPos.set(tLook.x + rr * Math.cos(el) * Math.cos(az), tLook.y + rr * Math.sin(el), tLook.z + rr * Math.cos(el) * Math.sin(az));
  const kc = 1 - Math.exp(-dt * 1.7); camPos.lerp(tPos, kc); camLook.lerp(tLook, kc);
  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera);

  // labels
  for (let i = 0; i < 12; i++) place(zLabs[i], lonVec(i * 30 + 15, ZR + 11, tmp2), mix.zod);
  const eP = E.holder.position;
  const mzCur = Math.floor(norm360(mLon) / (360 / 28));
  for (let i = 0; i < 28; i++) { mzLabs[i].el.classList.toggle('on', i === mzCur); place(mzLabs[i], tmp2.copy(eP).add(lonVec((i + .5) * 360 / 28, MZ_R + 1.3, scr)), mix.mz * (i === mzCur ? 1 : .75)); }
  for (const p of Object.values(P)) place(plLabs[p.id], p.holder.position, mix.pl, 0, -(p.r * 6 + 12));
  place(plLabs.sun, sun.position, Math.max(mix.pl, S.id === 'burooj' || S.id === 'reflect' ? .9 : 0) * (S.id === 'daynight' || S.id === 'manazil' ? 0 : 1), 0, -34);
  place(plLabs.moon, tmp2.copy(eP).add(moon.position), S.id === 'manazil' || S.id === 'daynight' ? .9 : 0, 0, -18);
  const sd = tmp.copy(eP).normalize();
  place(dnLabs.day, tmp2.copy(eP).addScaledVector(sd, -2.6), S.id === 'daynight' ? .95 : 0);
  place(dnLabs.night, tmp2.copy(eP).addScaledVector(sd, 2.6), S.id === 'daynight' ? .95 : 0);

  // inset (moon phase + mansion)
  if (S.id === 'manazil' && (phTick += dt) > .15) {
    phTick = 0; const sunGeo = norm360(Math.atan2(-eP.z, eP.x) / D2R + 180); const elong = norm360(mLon - sunGeo);
    drawPhase(elong); const ph = Math.round(elong / 45) % 8;
    if (ph !== lastPh) { phName.textContent = L.phases[ph]; lastPh = ph; }
    if (mzCur !== lastMz) { mzAr.textContent = MANAZIL[mzCur]; mzNo.textContent = L.mz(mzCur + 1); lastMz = mzCur; }
  }
}
setPlaying(playing);
go(0, false);
requestAnimationFrame(frame);
try { parent.postMessage({ type: 'cosmos:ready' }, location.origin); } catch (e) { }
</script>
