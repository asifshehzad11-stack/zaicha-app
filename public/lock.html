<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0C45">
<title>Zaicha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<!-- Zaicha app lock (v0.2 pass 2.2). Self-contained: no app code or data loads until the server accepts the password.
     The password is checked on the server only (POST /api/unlock). Nothing secret is in this file. -->
<style>
  :root{ --bg:#0A0C45; --s1:#161B78; --s2:#262EA8; --accent:#B8A9FF; --gold:#F2C14E; --muted:#C9C7F0; --weak:#FF8A8A; color-scheme:dark; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; min-height:100%; background:var(--bg); color:#fff; }
  body{ font-family:"Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:16px; line-height:1.6; min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px;
    background:radial-gradient(900px 520px at 80% -10%, rgba(154,144,236,.25), transparent 60%), radial-gradient(700px 520px at 0% 110%, rgba(74,79,208,.3), transparent 60%), var(--bg); }
  body.l-ur{ font-family:"Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; line-height:2; font-size:17px; }
  body.l-ar{ font-family:"Noto Naskh Arabic", "Amiri", serif; line-height:1.9; }
  body.l-hi{ font-family:"Noto Sans Devanagari", "Poppins", sans-serif; }
  body.l-zh{ font-family:"Noto Sans SC", "Poppins", sans-serif; }
  .stars{ position:fixed; inset:0; pointer-events:none; opacity:.7; background-image:
    radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 32% 8%, #fff, transparent), radial-gradient(1.2px 1.2px at 64% 22%, #fff, transparent),
    radial-gradient(1px 1px at 82% 12%, #fff, transparent), radial-gradient(1.3px 1.3px at 90% 40%, #fff, transparent), radial-gradient(1px 1px at 6% 52%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 48% 70%, #fff, transparent), radial-gradient(1px 1px at 74% 82%, #fff, transparent), radial-gradient(1.1px 1.1px at 22% 88%, #fff, transparent); }
  .card{ position:relative; width:100%; max-width:400px; padding:26px 22px 22px; border-radius:24px; background:rgba(22,27,120,.66);
    border:1px solid rgba(255,255,255,.12); box-shadow:0 20px 50px rgba(4,6,40,.55); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); text-align:center; }
  .logo{ width:56px; height:56px; color:#fff; margin:0 auto 6px; display:block; }
  .name{ font-family:"Poppins", sans-serif; font-weight:700; font-size:1.5rem; letter-spacing:-.01em; margin:0; }
  .bism{ font-family:"Amiri", "Noto Naskh Arabic", serif; font-size:1.35rem; line-height:2; margin:6px 0 2px; color:#fff; }
  .orn{ width:120px; height:1px; margin:0 auto 14px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  h1{ font-size:1.15rem; font-weight:600; margin:0 0 4px; }
  body.l-ur h1{ font-weight:600; }
  .sub{ margin:0 0 18px; color:var(--muted); font-size:.9rem; }
  form{ display:grid; gap:12px; text-align:start; }
  label{ font-size:.82rem; color:var(--muted); }
  .pw{ position:relative; }
  .pw input{ width:100%; min-height:52px; padding:0 52px 0 16px; border-radius:16px; border:1px solid rgba(255,255,255,.45); background:var(--s1); color:#fff;
    font:inherit; font-size:16px; direction:ltr; text-align:left; }
  .pw input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(184,169,255,.35); }
  .eye{ position:absolute; top:4px; right:4px; width:44px; height:44px; display:grid; place-items:center; border:0; border-radius:12px; background:transparent; color:var(--muted); cursor:pointer; }
  .eye:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .eye:focus-visible, button:focus-visible, select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .eye svg{ width:22px; height:22px; }
  .go{ min-height:52px; border:0; border-radius:999px; background:var(--accent); color:var(--bg); font:inherit; font-weight:700; font-size:1rem; cursor:pointer;
    box-shadow:0 8px 20px rgba(4,6,40,.4); transition:transform .12s, background-color .2s; }
  .go:hover{ background:#CFC5FF; }
  .go:active{ transform:scale(.98); }
  .go[disabled]{ opacity:.6; cursor:progress; }
  .msg{ min-height:1.6em; margin:0; font-size:.88rem; color:var(--weak); text-align:center; }
  .lang{ margin-top:18px; display:flex; align-items:center; justify-content:center; gap:8px; color:var(--muted); font-size:.82rem; }
  .lang select{ min-height:40px; padding:0 10px; border-radius:12px; border:1px solid rgba(255,255,255,.3); background:var(--s1); color:#fff; font:inherit; font-size:.9rem; }
  .foot{ margin-top:16px; color:var(--muted); font-size:.75rem; text-align:center; opacity:.85; }
  @media (prefers-reduced-motion: no-preference){ .card{ animation:rise .3s cubic-bezier(.2,.7,.2,1) both; } @keyframes rise{ from{ opacity:0; transform:translateY(8px); } } }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="card">
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <rect x="10.6" y="10.6" width="26.8" height="26.8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-opacity=".75"/>
    <polygon points="24,10.6 37.4,24 24,37.4 10.6,24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-opacity=".75"/>
    <line x1="10.6" y1="10.6" x2="37.4" y2="37.4" stroke="currentColor" stroke-width="1" stroke-opacity=".5"/>
    <line x1="37.4" y1="10.6" x2="10.6" y2="37.4" stroke="currentColor" stroke-width="1" stroke-opacity=".5"/>
    <circle cx="24" cy="24" r="3.2" fill="currentColor"/>
  </svg>
  <p class="name" lang="en">Zaicha</p>
  <p class="bism" lang="ar" dir="rtl">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
  <div class="orn" aria-hidden="true"></div>
  <h1 id="t-title">This app is private</h1>
  <p class="sub" id="t-sub">Enter the password to continue.</p>
  <form id="f" method="post" action="/api/unlock" autocomplete="on">
    <input type="hidden" name="next" id="next" value="/">
    <label for="pw" id="t-label">Password</label>
    <div class="pw">
      <input id="pw" name="password" type="password" required autocomplete="current-password" autofocus spellcheck="false" autocapitalize="off">
      <button type="button" class="eye" id="eye" aria-pressed="false" aria-controls="pw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path id="eyeSlash" d="M3 3l18 18" style="display:none"/></svg></button>
    </div>
    <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
    <button type="submit" class="go" id="go">Enter</button>
  </form>
  <div class="lang"><label for="lang" id="t-lang">Language</label>
    <select id="lang">
      <option value="en">English</option><option value="ur">اردو</option><option value="hi">हिन्दी</option><option value="ar">العربية</option><option value="zh">中文</option>
    </select>
  </div>
  <p class="foot" id="t-foot">Asif Shehzad Mughal · Pattoki</p>
</main>
<script>
(function(){
  var T = {
    en: { title: 'This app is private', sub: 'Enter the password to continue.', label: 'Password', go: 'Enter', wait: 'Checking…', wrong: 'That password is not right. Please try again.', many: 'Too many tries. Please wait 15 minutes and try again.', fail: 'Could not reach the server. Check your connection.', show: 'Show password', hide: 'Hide password', lang: 'Language', foot: 'Presented by Asif Shehzad Mughal, Pattoki' },
    ur: { title: 'یہ ایپ نجی ہے', sub: 'آگے بڑھنے کے لیے پاس ورڈ درج کریں۔', label: 'پاس ورڈ', go: 'داخل ہوں', wait: 'جانچ ہو رہی ہے…', wrong: 'پاس ورڈ درست نہیں۔ دوبارہ کوشش کریں۔', many: 'بہت زیادہ کوششیں ہو گئیں۔ 15 منٹ بعد دوبارہ کوشش کریں۔', fail: 'سرور سے رابطہ نہیں ہو سکا۔ اپنا کنکشن دیکھیں۔', show: 'پاس ورڈ دکھائیں', hide: 'پاس ورڈ چھپائیں', lang: 'زبان', foot: 'پیشکش: آصف شہزاد مغل، پتوکی' },
    hi: { title: 'यह ऐप निजी है', sub: 'आगे बढ़ने के लिए पासवर्ड डालें।', label: 'पासवर्ड', go: 'प्रवेश करें', wait: 'जाँच हो रही है…', wrong: 'पासवर्ड सही नहीं है। फिर से कोशिश करें।', many: 'बहुत अधिक प्रयास। 15 मिनट बाद फिर कोशिश करें।', fail: 'सर्वर से संपर्क नहीं हो सका। अपना कनेक्शन देखें।', show: 'पासवर्ड दिखाएँ', hide: 'पासवर्ड छिपाएँ', lang: 'भाषा', foot: 'प्रस्तुति: आसिफ़ शहज़ाद मुग़ल, पत्तोकी' },
    ar: { title: 'هذا التطبيق خاص', sub: 'أدخل كلمة المرور للمتابعة.', label: 'كلمة المرور', go: 'دخول', wait: 'جارٍ التحقق…', wrong: 'كلمة المرور غير صحيحة. حاول مرة أخرى.', many: 'محاولات كثيرة جدًا. انتظر 15 دقيقة ثم حاول مجددًا.', fail: 'تعذّر الاتصال بالخادم. تحقق من اتصالك.', show: 'إظهار كلمة المرور', hide: 'إخفاء كلمة المرور', lang: 'اللغة', foot: 'تقديم: آصف شهزاد مغل، بتوكي' },
    zh: { title: '此应用为私人应用', sub: '请输入密码以继续。', label: '密码', go: '进入', wait: '正在验证…', wrong: '密码不正确，请重试。', many: '尝试次数过多，请 15 分钟后再试。', fail: '无法连接服务器，请检查网络。', show: '显示密码', hide: '隐藏密码', lang: '语言', foot: '出品：Asif Shehzad Mughal，Pattoki' }
  };
  var RTL = { ur: 1, ar: 1 };
  var $ = function(id){ return document.getElementById(id); };
  var lang = 'en';
  try { lang = localStorage.getItem('zaicha.lang') || ''; } catch (e) {}
  if (!T[lang]) { var nl = (navigator.language || 'en').slice(0, 2).toLowerCase(); lang = T[nl] ? nl : 'en'; }
  var shown = false, lastMsg = '';
  function apply(){
    var t = T[lang];
    document.documentElement.lang = lang; document.documentElement.dir = RTL[lang] ? 'rtl' : 'ltr';
    document.body.className = 'l-' + lang;
    $('t-title').textContent = t.title; $('t-sub').textContent = t.sub; $('t-label').textContent = t.label;
    if (!$('go').disabled) $('go').textContent = t.go;
    $('t-lang').textContent = t.lang; $('t-foot').textContent = t.foot;
    $('eye').setAttribute('aria-label', shown ? t.hide : t.show);
    if (lastMsg) $('msg').textContent = t[lastMsg];
    $('lang').value = lang;
  }
  function say(k){ lastMsg = k; $('msg').textContent = k ? T[lang][k] : ''; }
  $('lang').addEventListener('change', function(){ lang = this.value; try { localStorage.setItem('zaicha.lang', lang); } catch (e) {} apply(); });
  $('eye').addEventListener('click', function(){ shown = !shown; $('pw').type = shown ? 'text' : 'password'; this.setAttribute('aria-pressed', String(shown)); $('eyeSlash').style.display = shown ? '' : 'none'; apply(); $('pw').focus(); });
  // where to go after unlocking: the page that was asked for (never another site)
  var q = new URLSearchParams(location.search);
  var nextUrl = q.get('next') || (location.pathname + location.search.replace(/([?&])locked=[^&]*&?/, '$1').replace(/[?&]$/, '') + location.hash);
  if (!/^\/(?!\/)/.test(nextUrl) || /^\/api\//.test(nextUrl)) nextUrl = '/';
  $('next').value = nextUrl;
  if (q.get('locked') === 'wrong') lastMsg = 'wrong'; else if (q.get('locked') === 'too_many') lastMsg = 'many';
  apply();
  $('f').addEventListener('submit', function(e){
    if (!window.fetch) return;              // old browsers: normal form post
    e.preventDefault();
    var pw = $('pw').value; if (!pw) { $('pw').focus(); return; }
    $('go').disabled = true; $('go').textContent = T[lang].wait; say('');
    fetch('/api/unlock', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ password: pw, next: nextUrl }) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { s: r.status, j: j }; }); })
      .then(function(x){
        if (x.s === 200 && x.j.ok) {
          // same page (only the #part may differ): a plain replace would not reload, so reload explicitly
          var u = new URL(x.j.next || nextUrl, location.href);
          if (u.pathname + u.search === location.pathname + location.search) { history.replaceState(null, '', u.pathname + u.search + u.hash); location.reload(); }
          else location.replace(u.href);
          return;
        }
        $('go').disabled = false; $('go').textContent = T[lang].go;
        say(x.s === 429 ? 'many' : 'wrong'); $('pw').value = ''; $('pw').focus();
      })
      .catch(function(){ $('go').disabled = false; $('go').textContent = T[lang].go; say('fail'); });
  });
})();
</script>
</body>
</html>
